model:
  default: solar-pro4
  provider: upstage
  api_key: ${UPSTAGE_API_KEY}
  context_length: 524288
  max_tokens: 2048

agent:
  reasoning_effort: low

mcp_servers:
  mabc-sources:
    command: python
    args:
      - /app/mabc_mcp_server.py
    enabled: true
    timeout: 120
    connect_timeout: 60
    supports_parallel_tool_calls: false
